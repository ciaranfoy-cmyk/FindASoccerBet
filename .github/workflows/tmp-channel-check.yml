name: tmp channel check
on:
  push:
    branches: [claude/crypto-sentiment-monitoring-5tf6ub]
    paths: [".github/workflows/tmp-channel-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: |
          for s in binance-killers-telegram crypto-pump-club-telegram wallstreet-queen-official-telegram fed-russian-insiders-telegram wolf-of-trading-telegram raven-signals-pro ian-crypto-trades-telegram altsignals degenpump; do
            loc=$(curl -s -o /dev/null -w "%{redirect_url}" -m 15 -A "Mozilla/5.0" "https://www.bitdegree.org/crypto/goon/$s")
            echo "REDIRECT $s -> $loc"
          done
      - run: |
          python - <<'PY'
          import time
          from crypto_radar.sources import telegram
          from crypto_radar import net
          now = time.time()
          for n in ["BitDegree"]:
              posts = telegram.parse_preview(net.get_text(f"https://t.me/s/{n}"), n)
              recent = [p for p in posts if now - p.created_utc < 86400]
              print(f"CHANNEL {n} page={len(posts)} last24h={len(recent)}")
          PY
